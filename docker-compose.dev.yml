# Только для локальной разработки: публикует порт Postgres на localhost.
# Файл не называется override, чтобы compose не подхватил его сам (на VPS порт не должен открываться).
# Подключать явно: docker compose -f docker-compose.yml -f docker-compose.dev.yml ...
services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'
