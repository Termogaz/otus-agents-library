server {
  listen 80;
  root /usr/share/nginx/html;
  # /v2 переходит на /v2/ без внешнего хоста в Location
  absolute_redirect off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;

  # Путь /api/... уходит в Node как есть: proxy_pass без URI в конце
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Протокол и адрес клиента для Express (TRUST_PROXY=1): протокол приходит от Caddy,
    # при прямом заходе на :8080 заголовок пуст и nginx его не передаёт
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Файлы с хешем в имени не меняются, кэш на год
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Без подмены главной страницей: несуществующий путь даёт 404
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }
}
