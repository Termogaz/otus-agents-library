# Лимит входов на адрес клиента до Node: 10 запросов в минуту, всплеск до 5, сверх — 429.
# Ограничитель в Express работает и без него; здесь он отсекает поток scrypt-проверок раньше.
# Файл подключается внутри http {} (conf.d), поэтому зона объявлена вне server.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  # /v2 переходит на /v2/ без внешнего хоста в Location
  absolute_redirect off;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;

  # Адрес клиента берётся из X-Forwarded-For только от прокси с localhost и частных сетей:
  # Caddy на хосте приходит через мост Docker. Caddy без trusted_proxies заменяет присланный
  # клиентом X-Forwarded-For адресом соединения, поэтому подделать адрес снаружи нельзя.
  # Порт 8080 опубликован только на 127.0.0.1 (docker-compose.yml).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Путь /api/... уходит в Node как есть: proxy_pass без URI в конце
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Протокол и адрес клиента для Express (TRUST_PROXY=1): протокол приходит от Caddy,
    # при прямом заходе на :8080 заголовок пуст и nginx его не передаёт. После real_ip
    # последним в X-Forwarded-For стоит адрес клиента, его Express и берёт в req.ip
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Вход: те же заголовки, что у /api/, плюс лимит запросов на адрес клиента
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @login_limited;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Отказ по лимиту — тот же JSON с кодом, что у Express: клиент покажет текст из спеки
  location @login_limited {
    default_type application/json;
    return 429 '{"code":"TOO_MANY_ATTEMPTS"}';
  }

  # Файлы с хешем в имени не меняются, кэш на год
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Без подмены главной страницей: несуществующий путь даёт 404
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }
}
